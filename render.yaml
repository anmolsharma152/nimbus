services:
  # 1. FastAPI Control Plane API + arq Worker (Runs concurrently on Free Tier)
  - type: web
    name: nimbus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LOG_FORMAT
        value: json
      - key: FRONTEND_URL
        value: https://nimbusagent.vercel.app
      # GitHub returns through the frontend's /api proxy so the session cookie is first-party
      - key: OAUTH_REDIRECT_BASE_URL
        value: https://nimbusagent.vercel.app

databases:
  # 2. PostgreSQL Database
  - name: nimbus-db
    plan: free
    databaseName: nimbus_db
    user: nimbus_user
