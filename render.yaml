services:
  # 1. FastAPI Control Plane API + arq Worker (Runs concurrently on Free Tier)
  - type: web
    name: nimbus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

databases:
  # 2. PostgreSQL Database
  - name: nimbus-db
    plan: free
    databaseName: nimbus_db
    user: nimbus_user
