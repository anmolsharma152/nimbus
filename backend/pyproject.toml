[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AI Agent", email = "bot@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.1",
    "websockets>=13.0,<17.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
