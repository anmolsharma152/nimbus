name: Backend Keep-Alive

on:
  schedule:
    # Ping every 10 minutes to prevent Render free-tier sleep
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "RENDER_BACKEND_URL secret not set. Skipping ping."
            exit 0
          fi
          echo "Pinging ${BACKEND_URL}/healthz ..."
          curl -s -f "${BACKEND_URL}/healthz" || echo "Ping completed with status code $?"
